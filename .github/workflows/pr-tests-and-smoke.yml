name: PR tests and headless sim smoke
# Pull request CI: tests + headless sim smoke (Lane C).

on:
  pull_request:

jobs:
  linux-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Headless sim smoke
        run: pnpm --filter @zbd/sim smoke
