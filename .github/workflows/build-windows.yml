name: Build Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Omit `version` — `package.json` `packageManager` pins pnpm (avoids pnpm/action-setup mismatch).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows bundle requires `icons/icon.ico`; repo only ships `icon.png` (see tauri.conf.json).
      - name: Generate Tauri icons for Windows
        working-directory: apps/desktop
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Build desktop (Vite)
        run: pnpm --filter @zbd/desktop build

      # NSIS only: WiX/MSI needs a committed `.ico` in `bundle.icon`; we generate icons for NSIS from PNG in CI.
      - name: Build Tauri bundles (unsigned)
        working-directory: apps/desktop
        env:
          CI: "true"
        run: pnpm tauri build -- --bundles nsis

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbd-windows-nsis
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
